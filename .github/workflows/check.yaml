name: 'Check'

# Pull requests only. main accepts nothing but a pull request whose required `check` passed on a
# branch up to date with it, so the commit a merge lands is the tree checked here: `main.yaml` does
# not check it again (ADR-0039).
on:
  pull_request:
    branches:
      - 'main'

concurrency:
  group: 'check-${{ github.event.pull_request.number }}'
  # A newer push supersedes the older run.
  cancel-in-progress: true

permissions:
  contents: 'read'

# Every action is pinned to a commit, with the release it is in beside it: a tag can be moved to
# other code, a commit cannot. Dependabot moves both (`.github/dependabot.yml`).
jobs:
  # A change to documentation alone builds and tests nothing, so `check` and its three servers stay
  # down for it and `docs` runs the documentation's own checks instead. A job, not a `paths-ignore`
  # on the triggers: a run that never starts reports no status, and a required check would wait for
  # one forever, while a job skipped by its `if` counts as passed. Not a step either — the service
  # containers start before the first step.
  changes:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    outputs:
      code: '${{ steps.classify.outputs.code }}'
      docs: '${{ steps.classify.outputs.docs }}'
      railway: '${{ steps.classify.outputs.railway }}'

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          # The whole history, to diff against the base, but no file contents: the names of the
          # changed paths are in the trees. Only the classifier is checked out.
          fetch-depth: 0
          filter: 'blob:none'
          sparse-checkout: 'scripts'

      # A pull request is classified whole, against its base, not by its last push: a docs commit
      # on top of a failed code change must not turn the pull request green. What counts as code is
      # in the script; a diff that cannot be computed is an empty list, which it reads as code.
      - name: 'Classify the change'
        id: 'classify'
        env:
          BASE_SHA: '${{ github.event.pull_request.base.sha }}'
        run: |
          files=''
          if git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            files=$(git diff --name-only --no-renames "$BASE_SHA...HEAD") || files=''
          fi
          printf '%s\n' "$files"
          printf '%s\n' "$files" | bash scripts/classify-changes.sh | tee -a "$GITHUB_OUTPUT"

  check:
    needs: 'changes'
    if: needs.changes.outputs.code == 'true'
    # One job: turbo already runs the workspaces in parallel, and a matrix would repeat the install
    # and the build in every leg.
    runs-on: 'ubuntu-latest'
    timeout-minutes: 30
    permissions:
      contents: 'read'
      # The GitHub OIDC token the remote cache step exchanges for a Turborepo one.
      id-token: 'write'

    # Every e2e suite skips itself when its server is unreachable, so each one needs its server
    # here, or the run is green without having tested anything. Locally, `pnpm docker:e2e` starts
    # the same set.
    services:
      postgres:
        image: 'postgres:15-alpine'
        env:
          POSTGRES_USER: 'admin'
          POSTGRES_PASSWORD: 'password123'
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: 'redis:8-alpine'
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # `definePgConfig` validates it at load, although `migrate:check` never connects; the storage
      # e2e suite migrates its own databases on this server.
      DATABASE_URL: 'postgresql://admin:password123@localhost:5432'
      TURBO_TELEMETRY_DISABLED: '1'

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          # The snapshot guard diffs the pull request against its base.
          fetch-depth: 0

      - name: 'Setup pnpm and node.js'
        uses: './.github/actions/setup'

      # `build` runs the three `@*/proto` compiles, which need protoc.
      - name: 'Install protoc'
        uses: './.github/actions/protoc'

      # Not a service container: JetStream needs the `-js` flag, and services take no command.
      - name: 'Start NATS'
        run: 'docker run -d --name nats -p 4222:4222 nats:2-alpine -js'

      # Vercel Remote Cache, shared by every pull request and by main: what one run built, the next
      # replays, whatever its branch. The GitHub OIDC token is exchanged for a short-lived
      # Turborepo one (a policy in the Vercel team names this repository), so no secret is stored.
      # A fork's pull request gets no OIDC token, and a failed exchange only costs the remote
      # cache: the step may fail, the local cache below still serves.
      - name: 'Turbo remote cache'
        if: vars.TURBO_TEAM != '' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: 'vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f' # v1.1.0
        with:
          team: '${{ vars.TURBO_TEAM }}'

      # Turbo's local cache, carried between runs: a task whose inputs did not change replays its
      # logs and outputs. `test`, `test:e2e` and `lint` are `cache: false` and always run. A pull
      # request reads the caches of its own branch and of main, which `main.yaml` keeps warm — the
      # fallback for the runs the remote cache does not reach (forks, a failed exchange).
      - name: 'Turbo cache'
        uses: 'actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9' # v6.1.0
        with:
          path: '.turbo/cache'
          key: 'turbo-${{ runner.os }}-${{ github.sha }}'
          restore-keys: 'turbo-${{ runner.os }}-'

      - name: 'Install dependencies'
        run: 'pnpm install --frozen-lockfile'

      - name: 'Build'
        run: 'pnpm build'

      # A `globalDependencies` glob that reaches build output (`**/.env` once matched a copy under
      # `.next/standalone/`) changes the global hash on every build, and every task misses the cache
      # on the next run. Checked after the build, once that output exists.
      - name: 'Global turbo inputs hold no build output'
        run: |
          pnpm turbo run build --dry=json | node -e '
            let json = "";
            process.stdin.on("data", (chunk) => (json += chunk)).on("end", () => {
              const files = Object.keys(JSON.parse(json).globalCacheInputs.files);
              const leaked = files.filter((file) => /(^|\/)(\.next|dist|node_modules)\//.test(file));
              for (const file of leaked) console.log(`::error::${file} is a global turbo input.`);
              process.exit(leaked.length ? 1 : 0);
            });
          '

      # One turbo run rather than a step each: none of the four waits for another, and in sequence
      # the three uncached ones were most of the job. `--continue` reports every failure, not the
      # first; `grouped` keeps each task's log in one piece.
      - name: 'Typecheck, lint and tests'
        env:
          # Every server runs beside the job, so an e2e suite that finds none fails instead of
          # skipping. Only the e2e setups read it.
          E2E_REQUIRE_SERVERS: '1'
        run: 'pnpm turbo run typecheck lint test test:e2e --log-order=grouped --continue'

      # `.railway/` is no workspace, so `typecheck` never reaches it, and the Railway CLI strips the
      # types without checking them: a wrong option in `railway.ts` is found here or in the dashboard.
      - name: 'Railway config typechecks'
        run: 'pnpm check:railway'

      # The build regenerates code and formats it, and lint runs with --fix: anything they changed
      # is codegen, formatting or a lint fix the pull request did not commit.
      - name: 'Committed code is up to date'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            echo '::error::The build or lint changed tracked files. Run `pnpm build && pnpm lint` and commit the result.'
            exit 1
          fi

      # Here as well as in `docs`: a renamed or removed package leaves its name behind in a
      # CLAUDE.md that the change never touched.
      - name: 'Docs layout holds'
        run: 'pnpm check:docs'

      # The specs of scripts/release-notes.sh, which writes the body of a published Release. Only
      # here: its fixtures are not `*.md`, so no change to it is a documentation change.
      - name: 'Repo scripts behave'
        run: 'pnpm check:scripts'

      - name: 'Env tables match their schemas'
        run: 'pnpm check:env-docs'

      - name: 'Entities match the migration snapshots'
        run: 'pnpm migrate:check'

      # Only `migration:create` may move a snapshot (see backend/CLAUDE.md). One changed without a
      # migration beside it would make the next `migrate:create` drop whatever it lost.
      - name: 'Every snapshot change comes with a migration'
        env:
          BASE_SHA: '${{ github.event.pull_request.base.sha }}'
        run: |
          changed() {
            git diff --name-only --no-renames "$@"
          }
          failed=0
          while IFS= read -r snapshot; do
            [ -n "$snapshot" ] || continue
            dir=$(dirname "$snapshot")
            if [ -z "$(changed --diff-filter=A "$BASE_SHA...HEAD" -- "$dir/*.migration.ts")" ]; then
              echo "::error file=$snapshot::The snapshot changed without a new migration in $dir. Generate one with \`pnpm migrate:create\`."
              failed=1
            fi
          done < <(changed --diff-filter=AM "$BASE_SHA...HEAD" -- 'backend/apps/*/src/migrations/.snapshot-*.json')
          exit "$failed"

      # Turbo never evicts, and each run restores the previous cache and adds to it. An entry is
      # dropped a week after it was written; the next miss rebuilds it.
      - name: 'Prune turbo cache'
        if: always()
        run: 'find .turbo/cache -type f -mtime +7 -delete 2>/dev/null || true'

  # What `check` verifies of the documentation, and nothing else: no servers, no protoc, no build.
  docs:
    needs: 'changes'
    if: needs.changes.outputs.code != 'true' && needs.changes.outputs.docs == 'true'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          # The release tags, which hold each released changelog entry as published. `check` gets
          # them through its full history.
          fetch-tags: true

      # Before the install: bash, git, grep and awk are all it needs.
      - name: 'Docs layout holds'
        run: 'bash scripts/docs-invariants.sh'

      - name: 'Setup pnpm and node.js'
        uses: './.github/actions/setup'

      # The generator parses the config files as text, so it needs its own package and nothing
      # built: no other workspace is installed.
      - name: 'Install the env-docs generator'
        run: 'pnpm install --frozen-lockfile --filter "@packages/env-docs..."'

      - name: 'Env tables match their schemas'
        run: 'pnpm check:env-docs'

  # A change to the Railway configuration alone builds and tests nothing either: `railway.ts` belongs
  # to no workspace, and only its typecheck reads it (the plan is the job below, the apply is in
  # `main.yaml`). Only the root is installed, which is where the SDK is.
  railway-check:
    needs: 'changes'
    if: needs.changes.outputs.code != 'true' && needs.changes.outputs.railway == 'true'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

      - name: 'Setup pnpm and node.js'
        uses: './.github/actions/setup'

      - name: 'Install the Railway SDK'
        run: 'pnpm install --frozen-lockfile --filter base'

      - name: 'Railway config typechecks'
        run: 'pnpm check:railway'

  # What a pull request would change in Railway, shown in the run's summary: the plan is read-only
  # and redacts variable values, and nothing is uploaded or commented, so the log of a public
  # repository holds no state of the environment beyond the names of what changes. A fork's pull
  # request and Dependabot's get no secrets, so there is nothing to plan with; they are skipped,
  # not failed. Only `pull_request` ever reaches here, never `pull_request_target`.
  railway-plan:
    needs: 'changes'
    if: >-
      (needs.changes.outputs.code == 'true' || needs.changes.outputs.railway == 'true')
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    env:
      # The CLI is pinned: its plan format and its destructive-change rules are what the `apply` job
      # of `main.yaml` trusts. Dependabot bumps the SDK in the root package.json but cannot see this
      # variable, so it moves by hand with it (the same value in both workflows).
      RAILWAY_CLI_VERSION: '5.62.1'
      NO_COLOR: '1'

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

      - name: 'Setup pnpm and node.js'
        uses: './.github/actions/setup'

      # Only the root: `.railway/railway.ts` imports the `railway` SDK from the root manifest.
      - name: 'Install the Railway SDK'
        run: 'pnpm install --frozen-lockfile --filter base'

      - name: 'Install the Railway CLI'
        run: 'npm install --global "@railway/cli@$RAILWAY_CLI_VERSION"'

      - name: 'Plan'
        env:
          RAILWAY_TOKEN: '${{ secrets.RAILWAY_TOKEN }}'
        run: |
          code=0
          railway config plan --verbose > "$RUNNER_TEMP/plan.txt" 2>&1 || code=$?
          {
            echo '### Railway plan'
            echo '```'
            cat "$RUNNER_TEMP/plan.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/plan.txt"
          exit "$code"
