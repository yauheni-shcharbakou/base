name: 'Setup pnpm and node.js'
description: "pnpm at the root manifest's `packageManager` version and node.js with the pnpm store cached. Installs nothing: each job installs what it needs."

# Every action is pinned to a commit, with the release it is in beside it. Dependabot moves them here
# as well as in the workflows (`.github/dependabot.yml` lists this directory).
runs:
  using: 'composite'
  steps:
    - name: 'Setup pnpm'
      uses: 'pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413' # v6.1.0

    - name: 'Setup node.js'
      uses: 'actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1' # v7.1.0
      with:
        node-version: 22
        cache: 'pnpm'
