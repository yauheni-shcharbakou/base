name: base

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    container_name: base-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - private_network
      - public_network
    profiles:
      - local
      - all

  postgres-init:
    image: postgres:15-alpine
    restart: on-failure
    container_name: base-postgres-init
    environment:
      POSTGRES_USER: admin
      PGPASSWORD: password123
    command: >
      bash -c "
        until pg_isready -h postgres -p 5432 -U $$POSTGRES_USER; do
          sleep 2;
        done;

        for db in auth storage; do
          chk=$$(psql -h postgres -U $$POSTGRES_USER -d postgres -tAc \"SELECT 1 FROM pg_database WHERE datname='$$db'\")

          if [ \"$$chk\" != \"1\" ]; then
            echo \"Create database $$db...\"
            psql -h postgres -U $$POSTGRES_USER -d postgres -c \"CREATE DATABASE $$db;\"
          else
            echo \"Database $$db already exists, skipping...\"
          fi
        done
      "
    depends_on:
      - postgres
    networks:
      - private_network
    profiles:
      - local
      - all

  # nats:
  #   image: nats:latest
  #   restart: unless-stopped
  #   container_name: base-nats
  #   ports:
  #     - '4222:4222'
  #     - '8222:8222'
  #   command: ['-js', '-m', '8222', '-sd', '/data', '--name', 'nats-node']
  #   volumes:
  #     - nats_data:/data
  #   networks:
  #     - private_network
  #     - public_network
  #   profiles:
  #     - local
  #     - all

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    container_name: base-redis
    ports:
      - '6379:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    networks:
      - private_network
      - public_network
    profiles:
      - local
      - all

  # Public tunnel to the host's backend.storage webhook listener, so Bunny Stream can deliver status
  # callbacks during local development. The domain is the account's static ngrok domain, so the
  # webhook URL in the Bunny library is set once and never changes. Without NGROK_AUTHTOKEN and
  # NGROK_DOMAIN the container exits cleanly and the rest of the local stack is unaffected.
  ngrok:
    image: ngrok/ngrok:3
    # Bounded: a wrong authtoken or a foreign domain fails the same way on every attempt.
    restart: on-failure:5
    container_name: base-ngrok
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
      NGROK_DOMAIN: ${NGROK_DOMAIN:-}
      NGROK_UPSTREAM: ${NGROK_UPSTREAM:-host.docker.internal:9002}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        if [ -z "$$NGROK_AUTHTOKEN" ] || [ -z "$$NGROK_DOMAIN" ]; then
          echo "NGROK_AUTHTOKEN or NGROK_DOMAIN is not set, tunnel skipped."
          exit 0
        fi
        exec ngrok http "$$NGROK_UPSTREAM" \
          --config /var/lib/ngrok/ngrok.yml \
          --authtoken "$$NGROK_AUTHTOKEN" \
          --url "https://$$NGROK_DOMAIN" \
          --log stdout
    ports:
      # Request inspector: every webhook Bunny sends is visible and replayable at localhost:4040.
      - '4040:4040'
    extra_hosts:
      # Resolves on Linux too; Docker Desktop provides it natively.
      - 'host.docker.internal:host-gateway'
    networks:
      - public_network
    profiles:
      - local
      - all

  backend.auth:
    build:
      context: .
      dockerfile: ./backend/apps/auth/Dockerfile
    restart: unless-stopped
    container_name: base-backend-auth
    ports:
      - '9001:9001'
    environment:
      PORT: 9001
      NODE_ENV: production
      DATABASE_URL: postgresql://admin:password123@postgres:5432
      AUTH_GRPC_URL: 0.0.0.0:8001
      JWT_ACCESS_PRIVATE_KEY_BASE64: ${JWT_ACCESS_PRIVATE_KEY_BASE64:-}
      JWT_ACCESS_PUBLIC_KEY_BASE64: ${JWT_ACCESS_PUBLIC_KEY_BASE64:-}
      REFRESH_JWT_SECRET: string123
      ADMIN_EMAIL: admin@gmail.com
      ADMIN_PASSWORD: string123
      # NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
      TEMP_TOKEN_EXPIRES_IN_MINUTES: 1
    networks:
      - private_network
    depends_on:
      - postgres
      # - nats
      - redis
    profiles:
      - all

  backend.storage:
    build:
      context: .
      dockerfile: ./backend/apps/storage/Dockerfile
    restart: unless-stopped
    container_name: base-backend-storage
    ports:
      # The Bunny Stream webhook listener. Exposed here for local development; in deployment this
      # is the port a public domain points at. Railway routes by service and port and has no
      # path-based ingress, so exposure is all-or-nothing per listener: the gRPC port stays private
      # and unexposed, while everything this one serves is public — which is why it serves exactly
      # one signature-guarded route.
      - '9002:9002'
    environment:
      PORT: 9002
      NODE_ENV: production
      DATABASE_URL: postgresql://admin:password123@postgres:5432
      AUTH_GRPC_URL: backend.auth:8001
      STORAGE_GRPC_URL: 0.0.0.0:8002
      # NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
      BUNNY_STORAGE_API_KEY: ${BUNNY_STORAGE_API_KEY:-}
      BUNNY_STORAGE_CDN_ZONE: ${BUNNY_STORAGE_CDN_ZONE:-}
      BUNNY_STORAGE_CDN_PRIVATE_KEY: ${BUNNY_STORAGE_CDN_PRIVATE_KEY:-}
      BUNNY_STORAGE_CDN_EXPIRES_IN_MINUTES: 10
      BUNNY_STREAM_API_KEY: ${BUNNY_STREAM_API_KEY:-}
      BUNNY_STREAM_READ_ONLY_API_KEY: ${BUNNY_STREAM_READ_ONLY_API_KEY:-}
      BUNNY_STREAM_LIBRARY_ID: ${BUNNY_STREAM_LIBRARY_ID:-}
      BUNNY_STREAM_CDN_ZONE: ${BUNNY_STREAM_CDN_ZONE:-}
      BUNNY_STREAM_CDN_PRIVATE_KEY: ${BUNNY_STREAM_CDN_PRIVATE_KEY:-}
      BUNNY_STREAM_CDN_EXPIRES_IN_MINUTES: 60
      BUNNY_STREAM_TUS_EXPIRES_IN_MINUTES: 120
      STORAGE_PENDING_FILE_TTL_HOURS: 24
    networks:
      - private_network
      - public_network
    depends_on:
      - postgres
      # - nats
      - redis
      - backend.auth
    profiles:
      - all

  backend.api-gateway:
    build:
      context: .
      dockerfile: ./backend/apps/api-gateway/Dockerfile
    restart: unless-stopped
    container_name: base-backend-api-gateway
    ports:
      - '${BACKEND_PORT:-9000}:9000'
    environment:
      PORT: 9000
      NODE_ENV: production
      API_GATEWAY_GRPC_URL: 0.0.0.0:8000
      AUTH_GRPC_URL: backend.auth:8001
      STORAGE_GRPC_URL: backend.storage:8002
      JWT_ACCESS_PUBLIC_KEY_BASE64: ${JWT_ACCESS_PUBLIC_KEY_BASE64:-}
    networks:
      - private_network
      - public_network
    depends_on:
      - backend.auth
      - backend.storage
    profiles:
      - all

  frontend.admin:
    build:
      context: .
      dockerfile: ./frontend/apps/admin/Dockerfile
    restart: unless-stopped
    container_name: base-frontend-admin
    ports:
      - '${ADMIN_PORT:-3336}:3336'
    environment:
      PORT: 3336
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      BACKEND_GRPC_URL: backend.api-gateway:8000
      DEFAULT_EMAIL: admin@gmail.com
      DEFAULT_PASSWORD: string123
      CHUNK_SIZE_MB: 1
    networks:
      - private_network
      - public_network
    depends_on:
      - backend.api-gateway
    profiles:
      - all

networks:
  private_network:
  public_network:
    driver: bridge

volumes:
  postgres_data:
  # nats_data:
  redis_data:
