syntax = "proto3";

package storage.storage_object;

import "google/protobuf/timestamp.proto";

enum StorageObjectType {
  FOLDER = 0;
  FILE = 1;
  IMAGE = 2;
  VIDEO = 3;
}

message StorageObject {
  string id = 1;
  google.protobuf.Timestamp createdAt = 2;
  optional google.protobuf.Timestamp updatedAt = 3;

  string name = 4;
  bool isPublic = 5;
  bool isFolder = 6;
  StorageObjectType type = 7;

  string userId = 8;
  optional string fileId = 9;
  optional string parentId = 10;

  oneof metadata {
    string folderPath = 11;
    string imageId = 12;
    string videoId = 13;
  }

  // A folder's whole subtree; only on the reads that ask for it, and never on a leaf.
  optional StorageObjectFolderStats folderStats = 14;
}

// What a folder holds, counted over its whole subtree: its live subfolders at any depth, and the
// leaves whose upload is READY. `totalSize` is the sum of those leaves' sizes in bytes, a `double`
// because a sum outgrows `int32` past 2 GiB, and an `int64` reaches Node as a `Long`.
message StorageObjectFolderStats {
  int32 fileCount = 1;
  int32 folderCount = 2;
  double totalSize = 3;
}
