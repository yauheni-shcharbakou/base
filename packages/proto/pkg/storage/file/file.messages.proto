syntax = "proto3";

package storage.file;

import "google/protobuf/timestamp.proto";
import "storage/common/common.messages.proto";
import "storage/file/file.proto";

// query

message FileQuery {
  optional string id = 1;
  repeated string ids = 2;
  optional string mimeType = 3;
  repeated string mimeTypes = 4;
  optional string userId = 5;
  repeated string userIds = 6;
  optional string extension = 7;
  optional FileUploadStatus uploadStatus = 8;
  repeated FileUploadStatus uploadStatuses = 9;
  optional google.protobuf.Timestamp createdBefore = 10;
}

// types

message FileList {
  repeated File items = 1;
  int32 total = 2;
}

message FileArray {
  repeated File items = 1;
}

// create

message FileCreate {
  string originalName = 1;
  int32 size = 2;
  string mimeType = 3;
}

message FileCreateOne {
  FileCreate file = 1;
  optional common.StorageMeta storage = 2;
  string userId = 3;
}

message FileCreateOneWeb {
  FileCreate file = 1;
  optional common.StorageMeta storage = 2;
}

// create many

// `items` took a new number when it stopped wrapping each `FileCreate`: the old item message and
// `FileCreate` are both length-delimited, so a peer on the other shape would misread every item
// instead of seeing none.
message FileCreateMany {
  optional common.StorageManyMeta storage = 1;
  reserved 2;
  string userId = 3;
  repeated FileCreate items = 4;
}

message FileCreateManyWeb {
  optional common.StorageManyMeta storage = 1;
  reserved 2;
  repeated FileCreate items = 4;
}

// upload

// Pre-signed credentials for a direct browser -> Bunny Storage PUT over its S3 API.
// The browser sends the file as the body of a PUT to `url` with `Content-Type: contentType` (a
// signed header, like the length), then calls `completeUpload` — Bunny Storage reports nothing
// back on its own. `expires` is unix seconds.
message FilePresignedUpload {
  string url = 1;
  string contentType = 2;
  string expires = 3;
}

message FileCreated {
  File file = 1;
  FilePresignedUpload upload = 2;
}

// Answers a `FileCreateMany` in request order: `items[i]` is what `FileCreateMany.items[i]` created. The
// batch is created whole or not at all, so the two always have the same length.
message FileCreatedArray {
  repeated FileCreated items = 1;
}

message FileCompleteUpload {
  string id = 1;
  optional string userId = 2;
}

// Files completed together. Each is completed on its own, as `completeUpload` would: one that has
// not been uploaded yet does not keep the others from being completed.
message FileCompleteMany {
  repeated string ids = 1;
  optional string userId = 2;
}

// What completing `id` came to: the completed file, or the gRPC status and message it failed with.
message FileCompleteResult {
  string id = 1;
  optional File file = 2;
  optional int32 code = 3;
  optional string error = 4;
}

// Answers a `FileCompleteMany` in request order, one result per requested id.
message FileCompleteResults {
  repeated FileCompleteResult items = 1;
}
