syntax = "proto3";

package storage;

import "common/fields.proto";
import "common/messages.proto";
import "common/types.proto";
import "storage/common/common.messages.proto";
import "storage/file/file.messages.proto";
import "storage/file/file.proto";

service FileService {
  rpc getUrlMap (common.GetUrlMap) returns (StringMap) {}
  rpc getDownloadMap (common.GetUrlMap) returns (common.DownloadMap) {}
  rpc getById (IdField) returns (file.File) {}
  rpc getList (GetList) returns (file.FileList) {}
  rpc createOne (file.FileCreateOne) returns (file.FileCreated) {}
  rpc createMany (file.FileCreateMany) returns (file.FileCreatedArray) {}
  rpc completeUpload (file.FileCompleteUpload) returns (file.File) {}
  rpc deleteOne (file.FileQuery) returns (file.File) {}
}

service FileAdminService {
  rpc getUrlMap (common.GetUrlMapShort) returns (StringMap) {}
  rpc getDownloadMap (common.GetUrlMapShort) returns (common.DownloadMap) {}
  rpc getById (IdField) returns (storage.file.File) {}
  rpc getList (GetList) returns (storage.file.FileList) {}
  rpc createOne (storage.file.FileCreateOne) returns (storage.file.FileCreated) {}
  rpc createMany (storage.file.FileCreateMany) returns (storage.file.FileCreatedArray) {}
  rpc completeUpload (IdField) returns (storage.file.File) {}
  rpc deleteById (IdField) returns (storage.file.File) {}
}

service FileWebService {
  rpc getUrlMap (common.GetUrlMapShort) returns (StringMap) {}
  rpc getDownloadMap (common.GetUrlMapShort) returns (common.DownloadMap) {}
  rpc createOne (storage.file.FileCreateOneWeb) returns (storage.file.FileCreated) {}
  rpc createMany (storage.file.FileCreateManyWeb) returns (storage.file.FileCreatedArray) {}
  rpc completeUpload (IdField) returns (storage.file.File) {}
  rpc deleteById (IdField) returns (storage.file.File) {}
}
