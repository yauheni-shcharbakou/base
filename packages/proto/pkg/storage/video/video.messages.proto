syntax = "proto3";

package storage.video;

import "storage/common/common.messages.proto";
import "storage/file/file.messages.proto";
import "storage/video/video.populates.proto";
import "storage/video/video.proto";

// query

message VideoQuery {
  optional string id = 1;
  repeated string ids = 2;
  optional string file = 3;
  optional string providerId = 4;
  repeated string providerIds = 5;
  optional string userId = 6;
}

// types

message VideoList {
  repeated VideoPopulated items = 1;
  int32 total = 2;
}

// create

message VideoCreate {
  string title = 1;
  optional string description = 2;
}

message VideoCreateOne {
  VideoCreate video = 1;
  file.FileCreate file = 2;
  optional common.StorageMeta storage = 3;
  string userId = 4;
}

message VideoCreateOneWeb {
  VideoCreate video = 1;
  file.FileCreate file = 2;
  optional common.StorageMeta storage = 3;
}

// create many

message VideoCreateManyItem {
  VideoCreate video = 1;
  file.FileCreate file = 2;
  reserved 3;
  reserved "uploadId";
}

message VideoCreateMany {
  optional common.StorageManyMeta storage = 1;
  repeated VideoCreateManyItem items = 2;
  string userId = 3;
}

message VideoCreateManyWeb {
  optional common.StorageManyMeta storage = 1;
  repeated VideoCreateManyItem items = 2;
}

// upload

// Pre-signed credentials for a direct browser -> Bunny Stream TUS upload.
// `expires` and `signature` are carried as strings because Bunny rejects the upload
// unless the AuthorizationExpire header matches the value that was signed byte-for-byte.
message VideoTusUpload {
  string endpoint = 1;
  string libraryId = 2;
  string videoId = 3;
  string signature = 4;
  string expires = 5;
  string filetype = 6;
  string title = 7;
}

message VideoCreated {
  Video video = 1;
  VideoTusUpload upload = 2;
}

// Answers a `VideoCreateMany` in request order: `items[i]` is what `VideoCreateMany.items[i]` created. The
// batch is created whole or not at all, so the two always have the same length.
message VideoCreatedArray {
  repeated VideoCreated items = 1;
}

// update

message VideoUpdateSet {
  optional string title = 1;
  optional string description = 2;
}

message VideoUpdate {
  optional VideoUpdateSet set = 1;
}

message VideoUpdateOne {
  VideoQuery query = 1;
  VideoUpdate update = 2;
}

message VideoUpdateById {
  string id = 1;
  VideoUpdate update = 2;
}
