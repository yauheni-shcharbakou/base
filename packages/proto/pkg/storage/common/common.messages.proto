syntax = "proto3";

package storage.common;

message DownloadData {
  string url = 1;
  string fileName = 2;
}

message DownloadMap {
  map<string, DownloadData> entries = 1;
}

message StorageMeta {
  string name = 1;
  bool isPublic = 2;
  string parent = 3;
}

message StorageManyMeta {
  bool isPublic = 1;
  string parent = 2;
}

// In both URL-map requests, field 3 carried the client's address — a signed read URL is bound to
// none (ADR-0025).
message GetUrlMap {
  optional string id = 1;
  repeated string ids = 2;
  reserved 3;
  reserved "ip";
  optional string userId = 4;
}

message GetUrlMapShort {
  optional string id = 1;
  repeated string ids = 2;
  reserved 3;
  reserved "ip";
}
