packages:
  - './backend/apps/*'
  - './backend/packages/*'
  - './frontend/apps/*'
  - './frontend/packages/*'
  - './packages/*'
# Single source of the version for every dependency more than one workspace declares.
# A workspace still declares the dependency itself — `"lodash": "catalog:"` — so its manifest
# stays honest (the tsdown factory and `import-x/no-extraneous-dependencies` both read it),
# while the version lives here alone and cannot drift between packages, which is how
# `@types/lodash` ended up pinned at two versions at once.
#
# Entries here are the shared ones only. A dependency a single workspace declares keeps its
# literal version in that manifest — cataloguing it would hide the version for no benefit.
#
# Not the same thing as `overrides` below: a catalog resolves the version a workspace *asks*
# for, an override rewrites what the whole tree *gets*, transitive dependencies included.
# `@grpc/grpc-js`, `axios`, `lodash` and `protobufjs` are in both, deliberately.
catalog:
  '@grpc/grpc-js': '1.14.4'
  '@grpc/proto-loader': '0.8.1'
  '@mikro-orm/cli': '7.0.15'
  '@mikro-orm/core': '7.0.15'
  '@mikro-orm/decorators': '7.0.15'
  '@mikro-orm/migrations': '7.0.15'
  '@mikro-orm/nestjs': '7.0.1'
  '@mikro-orm/postgresql': '7.0.15'
  '@nestjs/cli': '11.0.23'
  '@nestjs/common': '11.1.27'
  '@nestjs/config': '4.0.4'
  '@nestjs/core': '11.1.27'
  '@nestjs/jwt': '11.0.2'
  '@nestjs/microservices': '11.1.27'
  '@nestjs/platform-express': '11.1.27'
  '@nestjs/schedule': '6.1.3'
  '@nestjs/schematics': '11.1.0'
  '@nestjs/testing': '11.1.27'
  '@swc-node/register': '1.12.1'
  '@swc/core': '1.16.2'
  '@sweet-monads/either': '3.3.1'
  '@types/express': '5.0.5'
  '@types/jest': '30.0.0'
  '@types/lodash': '4.17.24'
  '@types/pug': '2.0.10'
  '@types/supertest': '6.0.3'
  axios: '1.16.0'
  change-case-all: '2.1.0'
  class-transformer: '0.5.1'
  class-validator: '0.14.3'
  ioredis: '5.11.1'
  jest: '30.3.0'
  lodash: '4.18.1'
  moment: '2.30.1'
  prettier: '3.9.4'
  protobufjs: '7.6.3'
  pug: '3.0.4'
  reflect-metadata: '0.2.2'
  rxjs: '7.8.2'
  source-map-support: '0.5.21'
  supertest: '7.2.2'
  ts-jest: '29.4.9'
  ts-loader: '9.5.7'
  ts-morph: '28.0.0'
  ts-node: '10.9.2'
  tsconfig-paths: '4.2.0'
  tsdown: '0.22.3'
  tsx: '4.22.4'
  typescript: '5.9.3'
  ulid: '3.0.2'
  zod: '4.4.3'
allowBuilds:
  '@nestjs/core': true
  '@scarf/scarf': false
  # Its postinstall only probes the native binding, which arrives as an optional dependency anyway.
  '@swc/core': false
  bcrypt: true
  esbuild: true
  # Optional native msgpackr accelerator pulled in by bullmq; the JS fallback is enough.
  msgpackr-extract: false
  protobufjs: true
  sharp: true
  unrs-resolver: true
overrides:
  axios: '1.16.0'
  lodash: '4.18.1'
  protobufjs: '7.6.3'
  '@grpc/grpc-js': '1.14.4'
  tmp: '0.2.7'
  ws: '8.21.0'
  'form-data': '4.0.6'
  'http-proxy-middleware': '3.0.7'
  multer: '2.2.0'
  'react-hook-form': '7.57.0'
  'sanitize-html': '2.17.4'
