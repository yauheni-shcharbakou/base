packages:
  - './backend/apps/*'
  - './backend/packages/*'
  - './frontend/apps/*'
  - './frontend/packages/*'
  - './packages/*'
# Single source of the version for every dependency more than one workspace declares.
# A workspace still declares the dependency itself — `"lodash": "catalog:"` — so its manifest
# stays honest (the tsdown factory and `import-x/no-extraneous-dependencies` both read it),
# while the version lives here alone and cannot drift between packages, which is how
# `@types/lodash` ended up pinned at two versions at once.
#
# Entries here are the shared ones only. A dependency a single workspace declares keeps its
# literal version in that manifest — cataloguing it would hide the version for no benefit.
#
# Not the same thing as `overrides` below: a catalog resolves the version a workspace *asks*
# for, an override rewrites what the whole tree *gets*, transitive dependencies included.
# `axios` and `protobufjs` are in both, deliberately (see their comments there).
catalog:
  '@grpc/grpc-js': '1.14.5'
  '@grpc/proto-loader': '0.8.1'
  '@mikro-orm/cli': '7.2.3'
  '@mikro-orm/core': '7.2.3'
  '@mikro-orm/decorators': '7.2.3'
  '@mikro-orm/migrations': '7.2.3'
  '@mikro-orm/nestjs': '7.1.0'
  '@mikro-orm/postgresql': '7.2.3'
  '@nestjs/cli': '12.0.8'
  '@nestjs/common': '12.1.2'
  '@nestjs/config': '12.0.1'
  '@nestjs/core': '12.1.2'
  '@nestjs/jwt': '12.0.2'
  '@nestjs/microservices': '12.1.2'
  '@nestjs/platform-express': '12.1.2'
  '@nestjs/schedule': '12.0.2'
  '@nestjs/schematics': '12.0.6'
  '@nestjs/testing': '12.1.2'
  '@swc-node/register': '1.12.1'
  '@swc/core': '1.16.2'
  '@sweet-monads/either': '3.3.1'
  '@types/express': '5.0.5'
  '@types/lodash': '4.17.25'
  '@types/pug': '2.0.10'
  '@types/supertest': '6.0.3'
  '@vitest/coverage-v8': '5.0.3'
  axios: '1.20.0'
  change-case-all: '2.1.0'
  class-transformer: '0.5.1'
  class-validator: '0.15.1'
  ioredis: '5.11.1'
  lodash: '4.18.1'
  moment: '2.31.0'
  pdfjs-dist: '6.3.289'
  prettier: '3.9.4'
  protobufjs: '7.6.6'
  pug: '3.0.4'
  reflect-metadata: '0.2.2'
  rxjs: '7.8.2'
  sharp: '0.35.5'
  source-map-support: '0.5.21'
  supertest: '7.2.2'
  ts-loader: '9.5.7'
  ts-morph: '28.0.0'
  ts-node: '10.9.2'
  ts-proto: '2.13.0'
  tsconfig-paths: '4.2.0'
  tsdown: '0.23.0'
  tsx: '4.22.4'
  typescript: '6.0.3'
  ulid: '3.0.2'
  unplugin-swc: '2.0.0'
  vite: '8.3.2'
  vitest: '5.0.3'
  zod: '4.4.3'
allowBuilds:
  '@nestjs/core': true
  '@scarf/scarf': false
  # Its postinstall only probes the native binding, which arrives as an optional dependency anyway.
  '@swc/core': false
  bcrypt: true
  esbuild: true
  # Optional native msgpackr accelerator pulled in by bullmq; the JS fallback is enough.
  msgpackr-extract: false
  protobufjs: true
  sharp: true
  unrs-resolver: true
overrides:
  # Copies of axios deep in the tree lagged behind, and it has a long record of vulnerable and compromised releases:
  # held here even while every parent's range would accept the catalog version.
  axios: '1.20.0'
  # Not a security pin: two copies of protobufjs encode `google.protobuf.Timestamp` differently,
  # so the gRPC loader and the generated code must share one. Never remove.
  protobufjs: '7.6.6'
  'http-proxy-middleware': '4.2.0'
  postcss: '8.5.29'
  qs: '6.16.0'
